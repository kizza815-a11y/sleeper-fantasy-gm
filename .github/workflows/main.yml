
name: Daily Sleeper Data

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sleeper:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Sleeper league data
        env:
          LEAGUE_ID: "1312908933546934272"
        run: |
          mkdir -p data

          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          league_id = os.environ["LEAGUE_ID"]
          base = "https://api.sleeper.app/v1"
          output = Path("data")

          state_request = urllib.request.Request(
              base + "/state/nfl",
              headers={"User-Agent": "DrDoomSleeperGM/1.0"}
          )
          with urllib.request.urlopen(state_request, timeout=30) as response:
              nfl_state = json.load(response)

          current_week = int(nfl_state.get("week") or 1)
          current_week = max(1, min(current_week, 18))

          endpoints = {
              "league": f"/league/{league_id}",
              "rosters": f"/league/{league_id}/rosters",
              "users": f"/league/{league_id}/users",
              **{f"transactions_week_{week}": f"/league/{league_id}/transactions/{week}" for week in range(1, current_week + 1)},
              "matchups": f"/league/{league_id}/matchups/{current_week}",
              "traded_picks": f"/league/{league_id}/traded_picks",
          }

          results = {"state": nfl_state}
          errors = {}

          for name, path in endpoints.items():
              try:
                  request = urllib.request.Request(
                      base + path,
                      headers={"User-Agent": "DrDoomSleeperGM/1.0"}
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      results[name] = json.load(response)
                  print(f"Retrieved {name}")
              except Exception as exc:
                  errors[name] = str(exc)
                  print(f"Failed {name}: {exc}")
              time.sleep(0.3)

          if "rosters" not in results or "league" not in results:
              raise RuntimeError(
                  "Critical Sleeper data unavailable; refusing to publish stale snapshot"
              )

          # Sleeper requests that the full player directory be fetched no more
          # than once per day. Keep a compact local index for name resolution.
          player_index_path = output / "player_directory.json"
          try:
              player_request = urllib.request.Request(
                  base + "/players/nfl",
                  headers={"User-Agent": "DrDoomSleeperGM/1.0"}
              )
              with urllib.request.urlopen(player_request, timeout=120) as response:
                  raw_players = json.load(response)
              player_index = {}
              for player_id, player in raw_players.items():
                  if not isinstance(player, dict):
                      continue
                  name = (player.get("full_name") or
                          " ".join(filter(None, [player.get("first_name"), player.get("last_name")])) or
                          player_id)
                  player_index[str(player_id)] = {
                      "name": name,
                      "position": player.get("position"),
                      "fantasy_positions": player.get("fantasy_positions") or [],
                      "team": player.get("team"),
                      "status": player.get("status"),
                      "active": player.get("active"),
                      "injury_status": player.get("injury_status"),
                      "search_rank": player.get("search_rank"),
                  }
              if not player_index:
                  raise RuntimeError("Empty Sleeper player directory")
              player_index_path.write_text(
                  json.dumps(player_index, separators=(",", ":")), encoding="utf-8"
              )
              print(f"Saved {len(player_index)} player records")
          except Exception as exc:
              errors["player_directory"] = str(exc)
              if not player_index_path.exists():
                  raise RuntimeError("No cached player directory available") from exc
              player_index = json.loads(player_index_path.read_text(encoding="utf-8"))
              print(f"Using cached player directory: {exc}")

          # A player is unavailable if on any league roster, including IR/taxi.
          rostered_ids = {
              str(player_id)
              for roster in results["rosters"]
              for player_id in (roster.get("players") or [])
          }
          fantasy_positions = {"QB", "RB", "WR", "TE"}
          available = [
              {"player_id": player_id, **player}
              for player_id, player in player_index.items()
              if player_id not in rostered_ids
              and fantasy_positions.intersection(player.get("fantasy_positions") or
                                                  [player.get("position")])
              and player.get("active") is not False
              and player.get("status") not in ("Retired", "Inactive")
          ]
          available.sort(key=lambda p: (
              p["search_rank"] if isinstance(p.get("search_rank"), (int, float)) else 999999,
              p["name"].lower()
          ))
          (output / "available_players.json").write_text(
              json.dumps({
                  "league_id": league_id,
                  "retrieved_at_utc": datetime.now(timezone.utc).isoformat(),
                  "rostered_player_count": len(rostered_ids),
                  "available_player_count": len(available),
                  "note": "Unrostered in league; Sleeper waiver eligibility and claim timing may differ.",
                  "players": available,
              }, indent=2),
              encoding="utf-8"
          )
          print(f"Saved {len(available)} unrostered fantasy players")

          results["snapshot_metadata"] = {
              "retrieved_at_utc": datetime.now(timezone.utc).isoformat(),
              "league_id": league_id,
              "target_roster_id": 7,
              "current_week": current_week,
              "errors": errors,
          }

          (output / "latest.json").write_text(
              json.dumps(results, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/player_directory.json data/available_players.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily Sleeper league data"
            git push
          fi
